name: 内核诊断编译（非刷机包）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/kernel-compile.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/kernel-compile.yml'

permissions:
  contents: read

jobs:
  baseline:
    if: github.event_name == 'workflow_dispatch'
    name: LineageOS 原版内核诊断编译
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 安装已复现的 Clang 18 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev
      - name: 固定上游源码
        run: bash scripts/prepare_sources.sh
      - name: 编译原版 LineageOS 内核（不启用 KernelSU）
        run: |
          set -o pipefail
          bash scripts/build_kernel.sh baseline 2>&1 | tee baseline-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-build-log
          path: baseline-build.log
          if-no-files-found: ignore

  ksu-diagnostic:
    name: 官方 KernelSU 4.19 完整编译及链接验收
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: 安装已复现的 Clang 18 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev
      - name: 获取固定上游源码
        run: bash scripts/prepare_sources.sh
      - name: 按 v3.3.1 固定版本执行统一兼容补丁
        run: python3 scripts/apply_patches.py --profile v3.3.1
      - name: 静态风险清单（已知阻塞不退出）
        run: python3 scripts/audit.py .work/kernel .work/KernelSU --expect-blocked selinux-abi manager-handshake
      - name: 编译完整内核 Image 与设备树（不生成可刷 Boot）
        run: |
          set -o pipefail
          bash scripts/build_kernel.sh ksu 2>&1 | tee ksu-build.log
      - name: 内核编译错误摘要
        if: always()
        run: |
          if test -s ksu-build.log; then
            python3 scripts/summarize_compiler_errors.py ksu-build.log >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernelsu-compile-diagnostics
          path: |
            ksu-build.log
            .work/build-manifest-ksu.json
          if-no-files-found: ignore
