name: 内核诊断编译（非刷机包）

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/CI_FULL_BUILD_TRIGGER.md'

permissions:
  contents: read

jobs:
  baseline:
    if: github.event_name == 'workflow_dispatch'
    name: LineageOS 原版内核诊断编译
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 安装交叉编译工具链（暂为探索版本）
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev
      - name: 固定上游源码
        run: bash scripts/prepare_sources.sh
      - name: 编译原版 LineageOS 内核（不启用 KernelSU）
        run: |
          set -o pipefail
          bash scripts/build_kernel.sh baseline 2>&1 | tee baseline-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-build-log
          path: baseline-build.log
          if-no-files-found: ignore

  ksu-diagnostic:
    name: 官方 KernelSU 4.19 完整编译及链接验收
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: 安装交叉编译工具链（暂为探索版本）
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev
      - name: 获取固定上游源码
        run: bash scripts/prepare_sources.sh
      - name: 应用已审查的安全兼容改动
        run: python3 scripts/apply_compat.py .work/KernelSU
      - name: 适配旧版 VFS file_operations
        run: python3 scripts/patch_vfs_419.py .work/KernelSU
      - name: 适配 Mount 与 fsnotify 旧 API
        run: python3 scripts/patch_legacy_apis.py .work/KernelSU
      - name: 适配旧版 Seccomp 和 task_work API
        run: python3 scripts/patch_policy_419.py .work/KernelSU
      - name: 适配 Linux 4.19 的 Sulog minmax 头文件
        run: python3 scripts/patch_sulog_419.py .work/KernelSU
      - name: 补齐 Linux 4.19 supercall task API
        run: python3 scripts/patch_dispatch_419.py .work/KernelSU
      - name: 阻止失败的 ARM64 syscall dispatcher 导致 init ENOSYS
        run: python3 scripts/patch_syscall_failclosed_419.py .work/KernelSU
      - name: 适配旧版 SELinux avtab flex_array
        run: python3 scripts/patch_avtab_419.py .work/KernelSU
      - name: 适配旧版 SELinux filename_trans
        run: python3 scripts/patch_filename_419.py .work/KernelSU
      - name: 适配旧版 SELinux type/attribute flex_array
        run: python3 scripts/patch_type_419.py .work/KernelSU
      - name: 保护旧版 SELinux 策略并发提交路径
        run: python3 scripts/patch_selinux_core_419.py .work/kernel
      - name: 将 KernelSU 规则编辑接入旧版策略事务
        run: python3 scripts/patch_rules_419.py .work/KernelSU
      - name: 修复 4.19 缺失的 path_umount 链接符号
        run: python3 scripts/patch_umount_419.py .work/kernel .work/KernelSU
      - name: 静态风险清单（已知阻塞不退出）
        run: python3 scripts/audit.py .work/kernel .work/KernelSU --expect-blocked selinux-abi manager-handshake
      - name: 尝试编译以收集实际错误（禁止发布 Image）
        run: |
          set -o pipefail
          bash scripts/build_kernel.sh ksu 2>&1 | tee ksu-build.log
      - name: 内核编译错误摘要
        if: always()
        run: |
          if test -s ksu-build.log; then
            python3 scripts/summarize_compiler_errors.py ksu-build.log >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernelsu-compile-diagnostics
          path: |
            ksu-build.log
            .work/build-manifest-ksu.json
          if-no-files-found: ignore
