name: 官方 KernelSU 快速驱动编译

on:
  push:
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/kernel-smoke.yml'
      - '.github/workflows/kernel-compile.yml'
      - '.github/workflows/source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernelsu-driver:
    name: 4.19 KernelSU Kbuild 快速诊断
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 安装交叉编译工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev
      - name: 获取固定源码
        run: bash scripts/prepare_sources.sh
      - name: 应用官方 KernelSU 的安全兼容补丁
        run: |
          python3 scripts/apply_compat.py .work/KernelSU
          python3 scripts/patch_vfs_419.py .work/KernelSU
          python3 scripts/patch_legacy_apis.py .work/KernelSU
          python3 scripts/patch_policy_419.py .work/KernelSU
          python3 scripts/patch_sulog_419.py .work/KernelSU
          python3 scripts/patch_dispatch_419.py .work/KernelSU
          python3 scripts/patch_avtab_419.py .work/KernelSU
          python3 scripts/patch_filename_419.py .work/KernelSU
          python3 scripts/patch_type_419.py .work/KernelSU
          python3 scripts/patch_selinux_core_419.py .work/kernel
          python3 scripts/patch_rules_419.py .work/KernelSU
          python3 scripts/patch_umount_419.py .work/kernel .work/KernelSU
      - name: 保留所有已知的安全阻塞
        run: python3 scripts/audit.py .work/kernel .work/KernelSU --expect-blocked selinux-abi manager-handshake
      - name: 仅编译 KernelSU 驱动目录（不生成可刷写镜像）
        run: |
          set -o pipefail
          KERNEL_QUICK=1 bash scripts/build_kernel.sh ksu 2>&1 | tee quick-driver.log
      - name: 对照正常启动原版 boot.img 的内嵌 Kconfig 与试验构建配置
        run: |
          set -Eeuo pipefail
          mkdir -p .work/stock
          curl -fLsS --connect-timeout 30 --max-time 1200 --retry 3 \
            'https://mirrorbits.lineageos.org/full/umi/20261004/boot.img' \
            -o .work/stock/boot.img
          echo 'ce4a917a9233921b03e748b1fffc7b5ecea613c7ddf72208f26c77189f31a693  .work/stock/boot.img' | sha256sum --check
          python3 scripts/inspect_stock_kernel.py .work/stock/boot.img \
            --generated-config .work/output-ksu/.config \
            --output kernel-config-diff.json | tee kernel-config-diff.log
          python3 - <<'PY'
          import json
          d=json.load(open("kernel-config-diff.json"))
          assert d["ikconfig_found"]
          assert d["stock_critical_config"]["CONFIG_KSU"] == "n"
          assert d["generated_critical_config"]["CONFIG_KSU"] == "y"
          assert d["boot_failure_root_cause_proven"] is False
          assert d["safe_to_flash"] is False
          PY
      - name: 编译错误汇总
        if: always()
        run: |
          if test -s quick-driver.log; then
            python3 scripts/summarize_compiler_errors.py quick-driver.log | tee error-summary.md
            cat error-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernelsu-driver-quick-log
          path: |
            quick-driver.log
            error-summary.md
            kernel-config-diff.json
            kernel-config-diff.log
          if-no-files-found: ignore
