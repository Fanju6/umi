name: umi P1p ABL/DTBO 11 cloud compatibility audit (NO FLASH)

on:
  pull_request:
    paths:
      - '.github/workflows/mainline-abl-dtbo-audit.yml'
      - 'scripts/mainline_abl_dtbo_audit.py'
      - 'tests/test_mainline_abl_dtbo_audit.py'
      - 'research/mainline/sm8250-xiaomi-umi-p1q.dts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Test official umi DTBO[11] applying to original and Mainline P1n DTBs
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Validate DTBO parser/merge audit without phone
        run: python3 -m unittest discover -s tests -p test_mainline_abl_dtbo_audit.py -v
      - name: Install DT / unpack utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends device-tree-compiler curl git
      - name: Build locked Linux v6.12 Mainline P1n DTB from source (no artifact token needed)
        run: |
          set -euo pipefail
          git clone --quiet --no-checkout --sparse --filter=blob:none --depth=1 --branch v6.12 \
            https://github.com/torvalds/linux.git upstream
          git -C upstream sparse-checkout set arch/arm64/boot/dts/qcom include/dt-bindings
          git -C upstream checkout --quiet --detach v6.12
          test "$(git -C upstream rev-parse HEAD)" = adc218676eef25575469234709c2d87185ca223a
          mkdir -p input
          soc=upstream/arch/arm64/boot/dts/qcom
          for stage in p0c p1a p1c p1m p1n p1q; do
            cp "research/mainline/sm8250-xiaomi-umi-$stage.dts" "$soc/"
          done
          cpp -nostdinc -I upstream/include -I "$soc" -undef -D__DTS__ \
            -x assembler-with-cpp "$soc/sm8250-xiaomi-umi-p1n.dts" /tmp/umi-p1n.dts
          dtc -@ -I dts -O dtb -o input/umi-p1n.dtb /tmp/umi-p1n.dts
          test "$(fdtget -t x input/umi-p1n.dtb / qcom,board-id)" = "2b 0"
          test "$(fdtget -t x input/umi-p1n.dtb / qcom,msm-id)" = "164 10000"
          cpp -nostdinc -I upstream/include -I "$soc" -undef -D__DTS__ \
            -x assembler-with-cpp "$soc/sm8250-xiaomi-umi-p1q.dts" /tmp/umi-p1q.dts
          dtc -@ -I dts -O dtb -o input/umi-p1q.dtb /tmp/umi-p1q.dts
          test "$(fdtget -t s input/umi-p1q.dtb /__symbols__ arch_timer)" = "/timer"
          test "$(fdtget -t s input/umi-p1q.dtb /__symbols__ qcom_tzlog)" = "/tz-log@146bf720"
          test "$(fdtget -t s input/umi-p1q.dtb /tz-log@146bf720 status)" = disabled
          test "$(fdtget -t x input/umi-p1q.dtb /timer interrupts)" = \
               "$(fdtget -t x input/umi-p1n.dtb /timer interrupts)"
          for node in /soc@0/ufshc@1d84000 /soc@0/phy@1d87000 \
                      /soc@0/usb@a6f8800 /soc@0/usb@a6f8800/usb@a600000 \
                      /soc@0/phy@88e3000 /soc@0/phy@88e8000; do
            test "$(fdtget -t s input/umi-p1q.dtb "$node" status)" = disabled
          done
      - name: Fetch official original base Boot and public DTBO
        run: |
          set -euo pipefail
          mkdir -p public bin
          curl -fLSs --retry 3 --connect-timeout 20 --max-time 600 \
            https://mirrorbits.lineageos.org/full/umi/20261004/boot.img \
            -o public/boot.img
          echo 'ce4a917a9233921b03e748b1fffc7b5ecea613c7ddf72208f26c77189f31a693  public/boot.img' | sha256sum -c -
          curl -fLSs --retry 3 --connect-timeout 20 --max-time 600 \
            https://mirrorbits.lineageos.org/full/umi/20261004/dtbo.img \
            -o public/dtbo.img
          git clone --quiet --depth 1 --branch lineage-23.0 \
            https://github.com/LineageOS/android_system_tools_mkbootimg.git \
            bin/mkbootimg
          python3 bin/mkbootimg/unpack_bootimg.py --boot_img public/boot.img \
            --out public/unpacked --format mkbootimg --null >/dev/null
          test -s public/unpacked/dtb
          test -s public/dtbo.img
      - name: Offline merge official umi DTBO index 11 with both base DTB kinds
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 scripts/mainline_abl_dtbo_audit.py \
            --dtbo public/dtbo.img \
            --public-boot-dtb public/unpacked/dtb \
            --mainline-dtb input/umi-p1n.dtb \
            --compatibility-dtb input/umi-p1q.dtb \
            --report dist/umi-p1p-abl-overlay-audit.json
          echo 'Only off-device FDT overlay compatibility was tested. No boot image generated.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload PUBLIC-METADATA-ONLY diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umi-P1p-DTBO11-vs-mainline-compat-ANALYSIS-ONLY
          path: dist/umi-p1p-abl-overlay-audit.json
          retention-days: 7
          if-no-files-found: warn
