name: umi Linux 6.12 DTS 离线编译验证

on:
  pull_request:
    paths:
      - 'research/mainline/**'
      - 'config/mainline-p1a-dependencies.json'
      - 'config/mainline-p1b-power.json'
      - 'config/mainline-p1b-observed.json'
      - 'scripts/mainline_p1a_audit.py'
      - 'scripts/mainline_p1b_sources.py'
      - 'scripts/mainline_p1b_probe.py'
      - 'scripts/mainline_p1b_observations.py'
      - 'tests/test_mainline_p1a.py'
      - 'tests/test_mainline_p1b.py'
      - 'tests/test_mainline_p1b_observations.py'
      - 'config/mainline-umi-p0c-memory.json'
      - 'scripts/mainline_validate_p0c.py'
      - 'tests/test_mainline_validate_p0c.py'
      - '.github/workflows/mainline-dts-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Linux v6.12 固定源码 / cpp + dtc（不生成 boot.img）
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify umi P0c safety and map
        run: |
          python3 scripts/mainline_validate_p0c.py
          python3 -m unittest discover -s tests -p test_mainline_validate_p0c.py -v
          python3 scripts/mainline_p1a_audit.py
          python3 -m unittest discover -s tests -p test_mainline_p1a.py -v
          python3 scripts/mainline_p1b_sources.py
          python3 scripts/mainline_p1b_observations.py
          python3 -m unittest discover -s tests -p test_mainline_p1b.py -v
      - name: Install Device Tree Compiler
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler
      - name: Fetch locked Torvalds Linux v6.12 DTS headers only
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --no-checkout --sparse --filter=blob:none --depth=1 --branch v6.12 https://github.com/torvalds/linux.git upstream
          git -C upstream sparse-checkout set arch/arm64/boot/dts/qcom include/dt-bindings Documentation/devicetree/bindings/reserved-memory
          git -C upstream checkout --quiet --detach v6.12
          actual=$(git -C upstream rev-parse HEAD)
          expected=adc218676eef25575469234709c2d87185ca223a
          test "$actual" = "$expected" || { echo "Upstream SHA mismatch $actual"; exit 1; }
      - name: Compile offline research DTS
        shell: bash
        run: |
          set -euo pipefail
          cp research/mainline/sm8250-xiaomi-umi-p0c.dts upstream/arch/arm64/boot/dts/qcom/
          cpp -nostdinc -I upstream/include -I upstream/arch/arm64/boot/dts/qcom -undef -D__DTS__ -x assembler-with-cpp upstream/arch/arm64/boot/dts/qcom/sm8250-xiaomi-umi-p0c.dts /tmp/umi-p0c-preprocessed.dts
          dtc -@ -I dts -O dtb -o /tmp/umi-p0c-offline.dtb /tmp/umi-p0c-preprocessed.dts
          test -s /tmp/umi-p0c-offline.dtb
          for node in xbl-aop@80600000 slpi@88c00000 adsp@8bb00000 spss@8e000000 cdsp-secure-heap@8e100000; do
            fdtget -t x /tmp/umi-p0c-offline.dtb "/reserved-memory/$node" reg
          done
          echo 'Only DTS syntax and selected reg values checked. NOT BOOTABLE.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify pinned umi source dependencies (UFS, USB, PMIC, memory-region)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/umi-vendor
          pinned=71b13e62f057a649b77fe4062feb73ee72ad609c
          for file in xiaomi-sm8250-common.dtsi kona-usb.dtsi umi-sm8250.dtsi; do
            curl --fail --location --silent --show-error --retry 3 \
              "https://raw.githubusercontent.com/LineageOS/android_kernel_xiaomi_sm8250/${pinned}/arch/arm64/boot/dts/vendor/qcom/${file}" \
              --output "/tmp/umi-vendor/${file}"
            test -s "/tmp/umi-vendor/${file}"
          done
          python3 scripts/mainline_p1a_audit.py \
            --upstream upstream/arch/arm64/boot/dts/qcom/sm8250.dtsi \
            --vendor-root /tmp/umi-vendor
      - name: Compile P1a offline-only board DTS; forbid enabled hardware
        shell: bash
        run: |
          set -euo pipefail
          cp research/mainline/sm8250-xiaomi-umi-p1a.dts upstream/arch/arm64/boot/dts/qcom/
          cpp -nostdinc -I upstream/include -I upstream/arch/arm64/boot/dts/qcom -undef -D__DTS__ -x assembler-with-cpp \
            upstream/arch/arm64/boot/dts/qcom/sm8250-xiaomi-umi-p1a.dts /tmp/umi-p1a-preprocessed.dts
          dtc -@ -I dts -O dtb -o /tmp/umi-p1a-offline.dtb /tmp/umi-p1a-preprocessed.dts
          test -s /tmp/umi-p1a-offline.dtb
          for node in /soc@0/ufshc@1d84000 /soc@0/phy@1d87000 \
                      /soc@0/usb@a6f8800 /soc@0/usb@a6f8800/usb@a600000 \
                      /soc@0/phy@88e3000 /soc@0/phy@88e8000; do
            state=$(fdtget -t s /tmp/umi-p1a-offline.dtb "$node" status)
            if [ "$state" != disabled ]; then
              echo "Unexpected enabled P1a controller: $node ($state)"
              exit 1
            fi
          done
          echo 'P1a DTS compiles, 6 hardware nodes disabled; safe_to_flash=false' >> "$GITHUB_STEP_SUMMARY"
      - name: P1b pinned PM8150B Type-C/VBUS source audit (never enable)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/torvalds/linux/adc218676eef25575469234709c2d87185ca223a/arch/arm64/boot/dts/qcom/pm8150b.dtsi" \
            --output /tmp/umi-upstream-pm8150b.dtsi
          test -s /tmp/umi-upstream-pm8150b.dtsi
          python3 scripts/mainline_p1b_sources.py \
            --upstream-soc upstream/arch/arm64/boot/dts/qcom/sm8250.dtsi \
            --upstream-pmicb /tmp/umi-upstream-pm8150b.dtsi \
            --vendor-common /tmp/umi-vendor/xiaomi-sm8250-common.dtsi \
            --vendor-usb /tmp/umi-vendor/kona-usb.dtsi \
            --vendor-umi /tmp/umi-vendor/umi-sm8250.dtsi
          echo 'P1b rail mapping static only; live voltages / Type-C roles are unverified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Optional reserved-memory schema diagnostics
        if: success()
        continue-on-error: true
        run: |
          python3 -m pip install --disable-pip-version-check dtschema==2026.9
          export PATH="$HOME/.local/bin:$PATH"
          dt-mk-schema -j upstream/Documentation/devicetree/bindings/reserved-memory/ > /tmp/umi-reserved-schema.json
          dt-validate -l reserved-memory -s /tmp/umi-reserved-schema.json /tmp/umi-p0c-offline.dtb
      - name: Research safety summary
        if: always()
        run: |
          echo 'safe_to_flash=false; no boot.img or firmware generated; Linux 6.12 not tested on device' >> "$GITHUB_STEP_SUMMARY"
