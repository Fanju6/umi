name: SM8250 主线移植 P0 静态检查

on:
  pull_request:
    paths:
      - 'config/mainline-research.json'
      - 'docs/mainline-port/**'
      - 'scripts/mainline_inventory.py'
      - 'tests/test_mainline_inventory.py'
      - '.github/workflows/mainline-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    name: 核对 umi 6.12/7.0 源码清单和安全门禁（不编译/刷机）
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 校验固定版本清单
        run: python3 scripts/mainline_inventory.py --manifest config/mainline-research.json
      - name: 执行离线回归测试
        run: python3 -m unittest discover -s tests -p 'test_mainline_inventory.py' -v
      - name: 标记证据边界
        run: |
          echo '仅 P0 静态元数据审计。未克隆 4 份源码，因此具体 Git SHA/文件检查标记为 not_scanned。' >> "$GITHUB_STEP_SUMMARY"
          echo '不会生成内核 Image、boot.img，也不会执行 ADB/Fastboot。' >> "$GITHUB_STEP_SUMMARY"
