name: 上游源码与安全门禁

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: 兼容补丁单元测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python 回归测试
        run: python3 -m unittest discover -s tests -v
      - name: 核对脱敏 umi 真机报告与固定内核源码
        run: python3 scripts/check_umi_preflight.py config/umi_preflight_20261014.json

  upstream-audit:
    name: 官方上游集成（已知阻塞检查）
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 获取固定版本并集成 KernelSU
        run: bash scripts/prepare_sources.sh
      - name: 按 v3.3.1 固定版本执行统一兼容补丁
        run: python3 scripts/apply_patches.py --profile v3.3.1
      - name: 校验旧内核原生 SELinux 快照及策略发布机制
        run: python3 scripts/inspect_selinux_419.py .work/kernel .work/KernelSU --require-native | tee selinux-api.json
      - name: 验证 4.19 Seccomp 早于 syscall Tracepoint 的 Manager 风险
        run: python3 scripts/inspect_manager_419.py .work/kernel .work/KernelSU --require-source | tee manager-audit.json
      - name: 验证 KernelSU v3.3.1 首次 ksud 引导链的静态合同
        run: python3 scripts/inspect_bootstrap_331.py .work/kernel .work/KernelSU --require-source --output bootstrap-audit.json
      - name: 对照已知 SELinux 阻塞，禁止误判可刷机
        run: |
          python3 scripts/audit.py .work/kernel .work/KernelSU --expect-blocked selinux-abi manager-handshake --json | tee audit.json
          python3 -c 'import json; d=json.load(open("audit.json")); assert d["status"]=="BLOCKED"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-audit-report
          path: |
            audit.json
            selinux-api.json
            manager-audit.json
            bootstrap-audit.json
          if-no-files-found: ignore
