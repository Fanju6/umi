name: 上游源码与安全门禁

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: 兼容补丁单元测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python 回归测试
        run: python3 -m unittest discover -s tests -v

  upstream-audit:
    name: 官方上游集成（已知阻塞检查）
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 获取固定版本并集成 KernelSU
        run: bash scripts/prepare_sources.sh
      - name: 应用无内存布局风险的兼容补丁
        run: python3 scripts/apply_compat.py .work/KernelSU
      - name: 将官方 KernelSU 的 VFS 包装器适配到 4.19
        run: python3 scripts/patch_vfs_419.py .work/KernelSU
      - name: 适配 Linux 4.19 的旧版 Mount / fsnotify API
        run: python3 scripts/patch_legacy_apis.py .work/KernelSU
      - name: 适配旧版 Seccomp 和 task_work API
        run: python3 scripts/patch_policy_419.py .work/KernelSU
      - name: 适配 Linux 4.19 的 Sulog minmax 头文件
        run: python3 scripts/patch_sulog_419.py .work/KernelSU
      - name: 补齐 Linux 4.19 supercall task API
        run: python3 scripts/patch_dispatch_419.py .work/KernelSU
      - name: 适配旧版 SELinux avtab flex_array
        run: python3 scripts/patch_avtab_419.py .work/KernelSU
      - name: 适配旧版 SELinux filename_trans
        run: python3 scripts/patch_filename_419.py .work/KernelSU
      - name: 适配旧版 SELinux type/attribute flex_array
        run: python3 scripts/patch_type_419.py .work/KernelSU
      - name: 保护旧版 SELinux 策略并发提交路径
        run: python3 scripts/patch_selinux_core_419.py .work/kernel
      - name: 将 KernelSU 规则编辑接入旧版策略事务
        run: python3 scripts/patch_rules_419.py .work/KernelSU
      - name: 修复 4.19 缺失的 path_umount 链接符号
        run: python3 scripts/patch_umount_419.py .work/kernel .work/KernelSU
      - name: 校验旧内核原生 SELinux 快照及策略发布机制
        run: python3 scripts/inspect_selinux_419.py .work/kernel .work/KernelSU --require-native | tee selinux-api.json
      - name: 验证 4.19 Seccomp 早于 syscall Tracepoint 的 Manager 风险
        run: python3 scripts/inspect_manager_419.py .work/kernel .work/KernelSU --require-source | tee manager-audit.json
      - name: 对照已知 SELinux 阻塞，禁止误判可刷机
        run: |
          python3 scripts/audit.py .work/kernel .work/KernelSU --expect-blocked selinux-abi manager-handshake --json | tee audit.json
          python3 -c 'import json; d=json.load(open("audit.json")); assert d["status"]=="BLOCKED"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-audit-report
          path: |
            audit.json
            selinux-api.json
            manager-audit.json
          if-no-files-found: ignore
