name: 官方 umi boot.img 只读结构审计

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/stock-boot-audit.yml'
      - 'scripts/inspect_stock_boot.py'
      - 'tests/test_stock_boot.py'
      - 'docs/BOOT_REFERENCE_TRIGGER.md'

permissions:
  contents: read

jobs:
  stock-boot-audit:
    name: 下载并解析 20261004 原版 boot.img（不刷写）
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: 解析器离线回归测试
        run: python3 -m unittest discover -s tests -p test_stock_boot.py -v
      - name: 通过官方镜像地址下载与当前系统匹配的 boot.img
        run: |
          set -Eeuo pipefail
          mkdir -p .work/stock_boot
          curl --fail --location --show-error --silent \
            --connect-timeout 30 --max-time 1200 --retry 3 --retry-delay 8 \
            'https://mirrorbits.lineageos.org/full/umi/20261004/boot.img' \
            --output .work/stock_boot/boot.img
          test "$(wc -c < .work/stock_boot/boot.img)" -ge 1048576
          test "$(wc -c < .work/stock_boot/boot.img)" -le 134217728
          sha256sum .work/stock_boot/boot.img | tee stock-boot.sha256
      - name: 核实 Android 原版启动镜像头和分区数据
        run: |
          python3 scripts/inspect_stock_boot.py .work/stock_boot/boot.img \
            --output stock-boot-layout.json | tee stock-boot-layout.log
          python3 - <<'PY'
          import json
          r=json.load(open('stock-boot-layout.json'))
          assert r['safe_to_flash'] is False
          assert r['boot_header_version'] == 2
          assert r['layout_plausible_for_umi']
          assert r['sections']['kernel']['size'] > 0
          assert r['sections']['ramdisk']['size'] > 0
          print('Read-only boot layout validation complete. NO FLASHABLE IMAGE generated.')
          PY
      - name: 验证原版 AVB Footer 及签名描述
        run: |
          set -Eeuo pipefail
          git clone --depth 1 --branch lineage-23.0 https://github.com/LineageOS/android_external_avb.git .work/avb
          python3 .work/avb/avbtool.py info_image --image .work/stock_boot/boot.img | tee stock-boot-avb.txt
      - name: 使用官方 mkbootimg 完整回环重封装并验证（仍为原版内核）
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 --branch lineage-23.0 https://github.com/LineageOS/android_system_tools_mkbootimg.git .work/mkbootimg
          python3 .work/mkbootimg/unpack_bootimg.py \
            --boot_img .work/stock_boot/boot.img --out .work/stock_boot/unpacked \
            --format mkbootimg --null > .work/stock_boot/args.bin
          declare -a args=()
          while IFS= read -r -d '' arg; do args+=("$arg"); done < .work/stock_boot/args.bin
          python3 .work/mkbootimg/mkbootimg.py "${args[@]}" \
            --output .work/stock_boot/roundtrip-boot.img
          python3 scripts/inspect_stock_boot.py .work/stock_boot/roundtrip-boot.img \
            --output roundtrip-boot-layout.json
          python3 - <<'PY'
          import json
          a=json.load(open('stock-boot-layout.json'))
          b=json.load(open('roundtrip-boot-layout.json'))
          for key in ('page_size','boot_header_version','header_size','board_name','cmdline','os_version_packed','kernel_addr','ramdisk_addr','tags_addr','dtb_addr'):
              assert a[key] == b[key], (key,a[key],b[key])
          for section in ('kernel','ramdisk','dtb'):
              assert a['sections'][section]['sha256'] == b['sections'][section]['sha256'], section
          print('Stock mkbootimg roundtrip passed (no AVB footer appended yet)')
          PY
      - name: 原版内核回环封装后重建 AVB Footer，并校验元数据
        run: |
          set -Eeuo pipefail
          kernel_salt="$(sha256sum .work/stock_boot/unpacked/kernel | cut -d' ' -f1)"
          python3 .work/avb/avbtool.py add_hash_footer \
            --image .work/stock_boot/roundtrip-boot.img \
            --partition_size 134217728 --partition_name boot \
            --algorithm NONE --hash_algorithm sha256 --salt "$kernel_salt" \
            --prop 'com.android.build.boot.os_version:16' \
            --prop 'com.android.build.boot.fingerprint:Xiaomi/lineage_umi/umi:16/BP4A.251205.006/94c0e3448d:userdebug/release-keys'
          python3 .work/avb/avbtool.py info_image \
            --image .work/stock_boot/roundtrip-boot.img | tee roundtrip-boot-avb.txt
          python3 scripts/inspect_stock_boot.py .work/stock_boot/roundtrip-boot.img \
            --output roundtrip-boot-with-avb.json
          grep -F 'Algorithm:                NONE' roundtrip-boot-avb.txt
          grep -F 'Partition Name:        boot' roundtrip-boot-avb.txt
          grep -F "Prop: com.android.build.boot.os_version -> '16'" roundtrip-boot-avb.txt
          grep -F "Prop: com.android.build.boot.fingerprint -> 'Xiaomi/lineage_umi/umi:16/BP4A.251205.006/94c0e3448d:userdebug/release-keys'" roundtrip-boot-avb.txt
          python3 - <<'PY'
          import json
          original=json.load(open('stock-boot-layout.json'))
          repacked=json.load(open('roundtrip-boot-with-avb.json'))
          assert original['image_size_bytes'] == repacked['image_size_bytes'] == 134217728
          assert repacked['avb_footer_magic_at_file_end']
          print('Roundtrip AVB hash footer has expected format and size')
          PY
      - name: 留存只读镜像结构报告（不上传原始 boot.img）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umi-20261004-stock-boot-audit
          path: |
            stock-boot.sha256
            stock-boot-layout.json
            stock-boot-layout.log
            stock-boot-avb.txt
            roundtrip-boot-layout.json
            roundtrip-boot-avb.txt
            roundtrip-boot-with-avb.json
          if-no-files-found: ignore
